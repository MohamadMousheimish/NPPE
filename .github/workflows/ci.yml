name: CI

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

# A newer push to the same branch/PR cancels the in-progress run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Cache the NuGet package cache keyed on the lock/project files.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore NPPE.ExamPrep.sln

      - name: Build
        run: dotnet build NPPE.ExamPrep.sln -c Release --no-restore

      # The E2E project drives a real browser; install Chromium (+ OS deps) before testing.
      - name: Install Playwright browsers
        run: pwsh NPPE.E2ETests/bin/Release/net9.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: dotnet test NPPE.ExamPrep.sln -c Release --no-build --verbosity normal
