<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Password updated · NPPE Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/design-system.css" />
<link rel="stylesheet" href="assets/auth.css" />
</head>
<body>
<main class="auth">

    <section class="brand panel--dark reg">
        <span class="reg-mark tl"></span><span class="reg-mark tr"></span>
        <span class="reg-mark bl"></span><span class="reg-mark br"></span>
        <div class="brand__grid grid-bg--dark"></div>

        <svg class="gauge" viewBox="0 0 128 128" aria-hidden="true">
            <circle cx="64" cy="64" r="60" stroke="var(--line-dark)" stroke-width="1"></circle>
            <circle cx="64" cy="64" r="52" stroke="var(--line-dark)" stroke-width="6" stroke-dasharray="1 7.6"></circle>
            <circle class="arc" cx="64" cy="64" r="44"></circle>
            <line x1="64" y1="18" x2="64" y2="26" stroke="var(--slate-2)" stroke-width="1"></line>
            <line x1="64" y1="102" x2="64" y2="110" stroke="var(--slate-2)" stroke-width="1"></line>
            <text class="lbl" x="64" y="63">NPPE</text>
            <text class="sub" x="64" y="76">DONE</text>
        </svg>

        <div class="wordmark">
            <span class="mark">N</span>
            <div class="stack"><b>NPPE&nbsp;Prep</b><span>Exam Preparation</span></div>
        </div>

        <div class="hero">
            <span class="eyebrow eyebrow--signal">Account recovery</span>
            <h1>You're all <em>set.</em></h1>
            <p>Your password is updated. Sign in and pick your prep back up.</p>
        </div>

        <div class="titleblock">
            <div class="row">
                <div class="cell"><span class="k">Process</span><span class="v">RESET</span></div>
                <div class="cell"><span class="k">Result</span><span class="v">SUCCESS</span></div>
                <div class="cell"><span class="k">Status</span><span class="v"><span class="live-dot"></span>CLOSED</span></div>
            </div>
            <div class="row">
                <div class="cell"><span class="k">Sessions</span><span class="v">CLEARED</span></div>
                <div class="cell"><span class="k">Progress</span><span class="v">INTACT</span></div>
                <div class="cell"><span class="k">Next</span><span class="v">SIGN IN</span></div>
            </div>
        </div>
    </section>

    <section class="formside" data-study-field data-study-count="22">
        <div class="formcard frame seq tc">
            <span class="icon-badge icon-badge--lg icon-badge--pass" style="--i:0">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
            </span>
            <h2 style="--i:1">Password updated</h2>
            <p class="sub" style="--i:2">You can now sign in with your new password.</p>
            <a class="btn btn--primary btn--block btn--lg" href="Login.html" style="--i:3">Sign in <span class="arrow">&rarr;</span></a>
        </div>
    </section>
</main>
<script src="assets/study-field.js"></script>
<script src="assets/motion.js"></script>
</body>
</html>
