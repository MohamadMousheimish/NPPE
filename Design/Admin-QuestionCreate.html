<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Add question · NPPE Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/design-system.css" />
<link rel="stylesheet" href="assets/app.css" />
</head>
<body>
<div data-appbar data-role="admin" data-active="exams" data-name="NPPE Admin" data-email="admin@nppe.ca"></div>

<main class="page">
    <div class="phead" data-reveal>
        <div><span class="eyebrow eyebrow--signal">MOD 01 · Add question</span><h1>New <em>question</em></h1><p class="sub">Write the question, add four options, and mark exactly one as correct.</p></div>
    </div>

    <div class="form-card" data-reveal style="max-width:820px">
        <form onsubmit="return false">
            <label class="field">
                <span class="field__label">Question text <span class="idx">01</span></span>
                <span class="field__wrap"><textarea class="field__input" placeholder="Enter the question stem…"></textarea></span>
            </label>

            <div class="row-2">
                <label class="field">
                    <span class="field__label">Feedback if correct <span class="idx">02</span></span>
                    <span class="field__wrap"><textarea class="field__input" placeholder="Shown when the student answers correctly."></textarea></span>
                </label>
                <label class="field">
                    <span class="field__label">Feedback if incorrect <span class="idx">03</span></span>
                    <span class="field__wrap"><textarea class="field__input" placeholder="Shown when the student answers incorrectly."></textarea></span>
                </label>
            </div>

            <div class="field__label" style="margin:0.8rem 0 0.6rem">Answer options <span class="idx" style="color:var(--signal)">exactly one correct</span></div>
            <div class="opt-editor" id="opts">
                <div class="opt-edit correct">
                    <div class="opt-edit__top"><span class="lab">A</span><label class="check"><input type="radio" name="correct" checked /><span class="box"></span> Correct</label></div>
                    <span class="field__wrap"><input class="field__input" type="text" placeholder="Option A text" /></span>
                </div>
                <div class="opt-edit">
                    <div class="opt-edit__top"><span class="lab">B</span><label class="check"><input type="radio" name="correct" /><span class="box"></span> Correct</label></div>
                    <span class="field__wrap"><input class="field__input" type="text" placeholder="Option B text" /></span>
                </div>
                <div class="opt-edit">
                    <div class="opt-edit__top"><span class="lab">C</span><label class="check"><input type="radio" name="correct" /><span class="box"></span> Correct</label></div>
                    <span class="field__wrap"><input class="field__input" type="text" placeholder="Option C text" /></span>
                </div>
                <div class="opt-edit">
                    <div class="opt-edit__top"><span class="lab">D</span><label class="check"><input type="radio" name="correct" /><span class="box"></span> Correct</label></div>
                    <span class="field__wrap"><input class="field__input" type="text" placeholder="Option D text" /></span>
                </div>
            </div>

            <div class="form-actions">
                <button class="btn btn--primary" type="submit">Add question <span class="arrow">&rarr;</span></button>
                <a class="btn btn--ghost" href="Admin-ExamDetails.html">Cancel</a>
            </div>
        </form>
    </div>

    <a class="backlink" href="Admin-ExamDetails.html">&larr; Back to exam</a>
</main>

<div data-appfoot data-year="2026"></div>
<script src="assets/motion.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
    var opts = document.getElementById("opts");
    opts.addEventListener("change", function (e) {
        if (e.target.name !== "correct") return;
        opts.querySelectorAll(".opt-edit").forEach(function (c) {
            c.classList.toggle("correct", c.contains(e.target));
        });
    });
})();
</script>
</body>
</html>
