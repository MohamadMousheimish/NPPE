<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Change password · NPPE Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/design-system.css" />
<link rel="stylesheet" href="assets/app.css" />
<link rel="stylesheet" href="assets/auth.css" />
</head>
<body>
<div data-appbar></div>

<main class="page">
    <div class="phead" data-reveal>
        <div><span class="eyebrow eyebrow--signal">Security</span><h1>Change <em>password</em></h1><p class="sub">Choose a new password for your account. You'll stay signed in on this device.</p></div>
    </div>

    <div class="form-card" data-reveal style="max-width:480px">
        <form onsubmit="return false">
            <label class="field">
                <span class="field__label">Current password <span class="idx">01</span></span>
                <span class="field__wrap"><input class="field__input" type="password" placeholder="••••••••" autocomplete="current-password" /></span>
            </label>
            <label class="field">
                <span class="field__label">New password <span class="idx">02</span></span>
                <span class="field__wrap"><input class="field__input" type="password" placeholder="••••••••" autocomplete="new-password" /></span>
            </label>
            <label class="field">
                <span class="field__label">Confirm new password <span class="idx">03</span></span>
                <span class="field__wrap"><input class="field__input" type="password" placeholder="••••••••" autocomplete="new-password" /></span>
            </label>

            <div class="note">
                <span class="anno"><strong>Password spec</strong></span>
                <ul>
                    <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.5l4 4 10-10"/></svg> At least 8 characters</li>
                    <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.5l4 4 10-10"/></svg> One uppercase letter</li>
                </ul>
            </div>

            <div class="form-actions">
                <button class="btn btn--primary" type="submit">Update password <span class="arrow">&rarr;</span></button>
                <a class="btn btn--ghost" href="Profile.html">Cancel</a>
            </div>
        </form>
    </div>

    <a class="backlink" href="Profile.html">&larr; Back to profile</a>
</main>

<div data-appfoot data-year="2026"></div>
<script src="assets/motion.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
