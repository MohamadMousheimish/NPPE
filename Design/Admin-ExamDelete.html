        <div><span class="eyebrow eyebrow--signal">Admin · Confirm</span><h1>Delete <em>exam</em></h1></div>

        <div class="warn-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg></div>
        <h2 style="font-size:1.3rem; margin-bottom:0.5rem">Deactivate this exam?</h2>
        <p class="muted">You're about to deactivate <strong style="color:var(--ink)">Professional Practice &amp; Ethics</strong>. It will be hidden from students, but existing attempt history is kept intact — this is a soft delete and can be reversed.</p>
        <div class="form-actions">
            <a class="btn btn--danger" href="Admin-Exams.html">Yes, deactivate</a>
            <a class="btn btn--ghost" href="Admin-ExamDetails.html">Cancel</a>
        </div>
    </div>

    <a class="backlink" href="Admin-Exams.html">&larr; Back to library</a>
