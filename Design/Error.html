<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Something went wrong · NPPE Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/design-system.css" />
<style>
    .err { min-height: 100vh; display: grid; place-items: center; padding: 2rem; text-align: center; }
    .err .grid { position: absolute; inset: 0; z-index: 0;
        -webkit-mask-image: radial-gradient(60% 50% at 50% 45%, #000 30%, transparent 80%);
                mask-image: radial-gradient(60% 50% at 50% 45%, #000 30%, transparent 80%); }
    .err__in { position: relative; z-index: 1; max-width: 520px; }
    .err .code { font-family: var(--font-mono); font-size: 0.74rem; letter-spacing: 0.2em; color: var(--signal);
        text-transform: uppercase; }
    .err h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(3rem, 10vw, 6rem); letter-spacing: -0.03em;
        margin: 0.6rem 0; }
    .err p { color: var(--slate); margin-bottom: 1.8rem; }
    .err .ticket { font-family: var(--font-mono); font-size: 0.72rem; color: var(--slate-2); margin-top: 1.6rem; }
</style>
</head>
<body>
<main class="err">
    <div class="grid grid-bg--faint"></div>
    <div class="err__in">
        <span class="code">— Fault · Signal lost</span>
        <h1>Off the grid.</h1>
        <p>Something went wrong on our end and the page didn't load. The issue has been logged — try again, or head back to safe ground.</p>
        <div style="display:flex; gap:0.7rem; justify-content:center">
            <a class="btn btn--primary" href="Dashboard.html">Back to dashboard <span class="arrow">&rarr;</span></a>
            <a class="btn btn--ghost" href="javascript:location.reload()">Retry</a>
        </div>
        <div class="ticket">REF · 8F3A-22C1-NPPE</div>
    </div>
</main>
</body>
</html>
